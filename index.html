<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dima AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body { background: #07030f; color: #f3e8ff; font-family: sans-serif; margin: 0; padding: 0; }
.glass { background: rgba(124,58,237,0.12); backdrop-filter: blur(15px); border: 1px solid rgba(167,139,250,0.25); }
.btn { background: linear-gradient(135deg, #9333ea, #d946ef); color: #fff; cursor: pointer; }
.modal { display: none; position: fixed; inset: 0; background: rgba(5,2,12,0.85); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
.modal.active { display: flex; }
input, textarea { background: rgba(255,255,255,0.1); border: 1px solid rgba(167,139,250,0.3); color: #fff; border-radius: 8px; padding: 10px; width: 100%; outline: none; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- LANDING PAGE -->
<div id="landing" class="flex-1 flex flex-col">
  <header class="glass flex items-center justify-between p-4 sticky top-0 z-50">
    <div class="font-bold text-lg flex items-center gap-2"><span>🟣</span> Dima AI</div>
    <div class="flex gap-2">
      <button onclick="openModal('auth')" class="glass px-4 py-2 rounded-full text-sm cursor-pointer">Kirish</button>
      <button onclick="openModal('auth')" class="btn px-4 py-2 rounded-full text-sm font-bold cursor-pointer">Boshlash</button>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-xl mx-auto">
    <h1 class="text-3xl sm:text-5xl font-black mb-4">Kelajak Sun'iy Intellekti Dima AI Bilan</h1>
    <p class="text-violet-200/80 mb-8 text-sm sm:text-base">Savol bering, rasm yarating va kod yozdiring. Hammasi o'zbek tilida.</p>
    <div class="flex flex-col sm:flex-row gap-3 w-full">
      <button onclick="goToDashboard()" class="btn py-3 px-6 rounded-2xl font-bold cursor-pointer flex-1">Dashboardga O'tish</button>
      <button onclick="openModal('pricing')" class="glass py-3 px-6 rounded-2xl font-bold cursor-pointer flex-1">Tariflar</button>
    </div>
  </main>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden h-screen flex flex-col">
  <header class="glass flex items-center justify-between p-4">
    <span class="font-bold">Dima AI Dashboard</span>
    <div class="flex gap-2 items-center">
      <span id="userEmail" class="text-xs text-violet-300"></span>
      <button onclick="goHome()" class="glass px-3 py-1.5 rounded-lg text-xs cursor-pointer">Chiqish</button>
    </div>
  </header>

  <div id="chatArea" class="flex-1 overflow-y-auto p-4 space-y-3 max-w-2xl mx-auto w-full">
    <div class="text-center text-violet-400 my-auto py-10" id="emptyText">Savol yozing va sun'iy intellekt bilan muloqotni boshlang!</div>
    <div id="messages" class="space-y-3"></div>
  </div>

  <div class="p-4 glass">
    <div class="max-w-2xl mx-auto flex gap-2">
      <textarea id="prompt" rows="1" placeholder="Xabar yozing..." class="flex-1 resize-none"></textarea>
      <button onclick="sendMsg()" class="btn px-5 rounded-xl font-bold cursor-pointer"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>
</div>

<!-- MODALS -->
<div id="modal-auth" class="modal">
  <div class="glass p-6 rounded-2xl w-full max-w-sm space-y-4">
    <div class="flex justify-between items-center"><h3 class="font-bold text-lg">Tizimga kirish</h3><button onclick="closeModal()" class="cursor-pointer">✕</button></div>
    <input id="emailInput" type="email" placeholder="Email kiriting">
    <button onclick="loginUser()" class="btn w-full py-3 rounded-xl font-bold cursor-pointer">Kirish</button>
  </div>
</div>

<div id="modal-pricing" class="modal">
  <div class="glass p-6 rounded-2xl w-full max-w-sm space-y-4 text-center">
    <div class="flex justify-between items-center"><h3 class="font-bold text-lg">Tariflar</h3><button onclick="closeModal()" class="cursor-pointer">✕</button></div>
    <div class="p-4 glass rounded-xl border border-fuchsia-500">
      <p class="font-bold text-fuchsia-300">Pro Plan - 49,000 so'm</p>
      <button onclick="alert('To\'lov tizimi ulanmoqda!')" class="btn w-full py-2.5 mt-3 rounded-xl font-bold cursor-pointer">Sotib olish</button>
    </div>
  </div>
</div>

<script>
function openModal(name) {
  closeModal();
  if(name === 'auth') document.getElementById('modal-auth').classList.add('active');
  if(name === 'pricing') document.getElementById('modal-pricing').classList.add('active');
}

function closeModal() {
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
}

function goToDashboard() {
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
}

function goHome() {
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('landing').classList.remove('hidden');
}

function loginUser() {
  var email = document.getElementById('emailInput').value.trim();
  if(!email) { alert('Emailni kiriting!'); return; }
  document.getElementById('userEmail').textContent = email;
  closeModal();
  goToDashboard();
}

function sendMsg() {
  var prompt = document.getElementById('prompt');
  var text = prompt.value.trim();
  if(!text) return;
  prompt.value = '';

  document.getElementById('emptyText').style.display = 'none';
  var msgBox = document.getElementById('messages');
  
  // User message
  msgBox.innerHTML += '<div class="flex justify-end"><div class="bg-purple-600 p-3 rounded-2xl max-w-[80%] text-sm">' + text + '</div></div>';
  
  // AI reply simulation
  setTimeout(function() {
    msgBox.innerHTML += '<div class="flex justify-start"><div class="glass p-3 rounded-2xl max-w-[80%] text-sm">Javob: ' + text + ' (Simulyatsiya)</div></div>';
    var area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
  }, 500);
}
</script>
</body>
</html>
